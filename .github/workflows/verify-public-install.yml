name: Verify public Wayfinder installation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/verify-public-install.yml
      - tool/verify_public_install.py
      - tool/install.sh
      - tool/install.ps1

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install from public URLs and exercise retrieval without Dart
        run: python tool/verify_public_install.py
