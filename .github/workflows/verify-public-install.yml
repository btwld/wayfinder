name: Verify public Wayfinder installation

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Platform for the public install smoke test
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-15
          - windows-latest
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
  pull_request:
    # ready_for_review reruns the draft gate. Label and edit events are not
    # triggers. Path selection is a job below, so a pull request that does
    # not touch the installer still reports this check.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify public-install changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DIFF_DOTS: ${{ github.event_name == 'pull_request' && '...' || '..' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled and manual runs always install."
            exit 0
          fi
          python3 tool/ci/classify_changes.py --mode public-install

  install:
    name: install (${{ inputs.runner || 'ubuntu-latest' }})
    needs: changes
    if: >-
      needs.changes.result == 'success' &&
      needs.changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # #170 kept macOS and Windows on manual dispatch. A pull request, push,
    # or weekly run cannot select those inputs; only workflow_dispatch can.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # PRs and manual runs verify the selected ref's installer against published archives.
      # Pushes fetch this commit from the public host; scheduled runs fetch main.
      WAYFINDER_USE_LOCAL_INSTALLER: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && '1' || '' }}
      WAYFINDER_INSTALLER_REF: ${{ github.event_name == 'push' && github.sha || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install from public URLs and exercise retrieval without Dart
        run: python tool/verify_public_install.py

  required-checks:
    name: Public install required checks
    needs: [changes, install]
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report the required check
        env:
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'true' || 'false' }}
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          RESULTS: install=${{ needs.install.result }}
        run: python3 tool/ci/classify_changes.py --require
