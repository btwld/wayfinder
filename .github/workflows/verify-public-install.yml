name: Verify public Wayfinder installation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-public-install.yml
      - tool/verify_public_install.py
      - tool/install.sh
      - tool/install.ps1
  pull_request:
    paths:
      - .github/workflows/verify-public-install.yml
      - tool/verify_public_install.py
      - tool/install.sh
      - tool/install.ps1

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: install (${{ matrix.os }}${{ matrix.powershell && format(', {0}', matrix.powershell) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            powershell: pwsh
          - os: windows-latest
            powershell: powershell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Pull requests run their own scripts against the published archives.
      # Pushes fetch this commit from the public host; other runs fetch main.
      WAYFINDER_USE_LOCAL_INSTALLER: ${{ github.event_name == 'pull_request' && '1' || '' }}
      WAYFINDER_INSTALLER_REF: ${{ github.event_name == 'push' && github.sha || 'main' }}
      WAYFINDER_POWERSHELL: ${{ matrix.powershell }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install from public URLs and exercise retrieval without Dart
        run: python tool/verify_public_install.py
