name: Publish wayfinder_embeddings

on:
  push:
    tags: ['wayfinder_embeddings-v*']

permissions:
  contents: read

concurrency:
  group: publish-wayfinder_embeddings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Match tag to package version
        working-directory: packages/wayfinder_embeddings
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          test "$TAG" = "wayfinder_embeddings-v$version"
      # No OIDC permission here: dependency downloads use normal public access.
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/wayfinder_embeddings
      - run: dart test
        working-directory: packages/wayfinder_embeddings
      # Exact llamadart/ObjectBox pins are reviewed compatibility constraints.
      - run: dart pub publish --dry-run --ignore-warnings
        working-directory: packages/wayfinder_embeddings

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Check whether pub.dev already has this version
        id: pub
        working-directory: packages/wayfinder_embeddings
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          bash "$GITHUB_WORKSPACE/tool/ci/pub-version-published.sh" wayfinder_embeddings "$version" >> "$GITHUB_OUTPUT"
      - if: steps.pub.outputs.published == 'true'
        run: echo "wayfinder_embeddings is already on pub.dev; skipping upload."
      # The same immutable tag passed verification above. Validation runs:
      # dart-lang/pub-dev#9576, which rejected authenticated metadata reads
      # with HTTP 403 and forced --skip-validation here, is fixed upstream.
      # --force only answers the confirmation a workflow cannot; it publishes
      # despite the warnings the exact llamadart and ObjectBox pins draw, which
      # are reviewed compatibility constraints. --ignore-warnings is rejected
      # outside --dry-run, so it belongs on the dry run above and nowhere else.
      - if: steps.pub.outputs.published != 'true'
        run: dart pub publish --force
        working-directory: packages/wayfinder_embeddings
