name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        sdk: ["3.6.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed bin lib test
        working-directory: packages/okf_profile
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/okf_profile
      - if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: dart run okf_profile:okfp validate examples/knowledge
      - if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: dart pub publish --dry-run
        working-directory: packages/okf_profile
      - if: matrix.sdk == 'stable'
        run: dart pub -C tool/release get --enforce-lockfile
      - if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        working-directory: tool/release
        run: |
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart run test
      - if: matrix.sdk == 'stable'
        shell: bash
        env:
          ASSET: build/okfp-ci-test${{ runner.os == 'Windows' && '.exe' || '' }}
        run: >-
          dart --packages=tool/release/.dart_tool/package_config.json
          tool/release/grind.dart okfp-build-binary
      - if: matrix.sdk == 'stable'
        shell: bash
        run: ./build/okfp-ci-test${{ runner.os == 'Windows' && '.exe' || '' }} --version
      - if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: bash tool/ci/verify-installer-pins.sh

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The runner context is unavailable in job-level env; the workspace is.
      OKF_INSTALL_DIR: ${{ github.workspace }}/.okf-bin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install with no Dart, no gh session, no sudo
        run: sh tool/install.sh
      - run: bash tool/ci/verify-installer.sh "$OKF_INSTALL_DIR"
      - name: Re-running with matching pins is a no-op
        run: |
          sh tool/install.sh | tee rerun.log
          [[ "$(grep -c 'nothing to do' rerun.log)" == 2 ]]
      - name: Install again with attestation verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$OKF_INSTALL_DIR"
          sh tool/install.sh | tee verified.log
          ! grep -q 'were not verified' verified.log
      - run: bash tool/ci/verify-installer.sh "$OKF_INSTALL_DIR"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npx --yes @anthropic-ai/claude-code plugin validate .
