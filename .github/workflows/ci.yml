name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        sdk: ["3.9.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed bin lib test
        working-directory: packages/okf_profile
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/okf_profile
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/knowledge_embeddings
      - run: dart test
        working-directory: packages/knowledge_embeddings
      - if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: dart run okf_profile:okfp validate examples/knowledge
      - if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: dart pub publish --dry-run
        working-directory: packages/okf_profile
      - if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: dart pub -C tool/release get --enforce-lockfile
      - if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        working-directory: tool/release
        run: |
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart run test
      - if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        env:
          ASSET: build/okfp-ci-test
        run: >-
          dart --packages=tool/release/.dart_tool/package_config.json
          tool/release/grind.dart okfp-build-binary
      - if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: ./build/okfp-ci-test --version
