name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require a stable release tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [[ "$REF_TYPE" == tag ]]
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

  platforms:
    needs: ref
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: matrix
        run: echo "value=$(bash tool/ci/release-matrix.sh)" >> "$GITHUB_OUTPUT"

  verify:
    needs: ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart pub -C tool/release get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed bin lib test
        working-directory: packages/okf_profile
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/okf_profile
      - working-directory: tool/release
        run: dart analyze --fatal-infos
      - working-directory: tool/release
        run: dart run test
      - run: dart pub publish --dry-run
        working-directory: packages/okf_profile

  binaries:
    needs: [platforms, verify]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart pub -C tool/release get --enforce-lockfile
      - env:
          ASSET: ${{ matrix.asset }}
        run: >-
          dart --packages=tool/release/.dart_tool/package_config.json
          tool/release/grind.dart okfp-build-binary
      - env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ github.ref_name }}
        run: bash tool/ci/verify-engine-version.sh "./$ASSET" "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub -C tool/release get --enforce-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: okfp-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DISTRIBUTION: dist
        run: >-
          dart --packages=tool/release/.dart_tool/package_config.json
          tool/release/grind.dart okfp-deploy-github

  dist:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub -C tool/release get --enforce-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: okfp-*
          path: dist
          merge-multiple: true
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: conceptadev
          repositories: okf-profile-dist
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DISTRIBUTION: dist
        run: >-
          dart --packages=tool/release/.dart_tool/package_config.json
          tool/release/grind.dart okfp-deploy-dist

  pub-publish:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check whether pub.dev already has this version
        id: pub
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if curl --fail --silent --show-error \
            https://pub.dev/api/packages/okf_profile | \
            jq -e --arg version "$version" \
              '.versions | any(.version == $version)' >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pub.outputs.published != 'true'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - if: steps.pub.outputs.published != 'true'
        run: dart pub get
      - if: steps.pub.outputs.published != 'true'
        run: dart pub -C tool/release get --enforce-lockfile
      - if: steps.pub.outputs.published != 'true'
        run: >-
          dart --packages=tool/release/.dart_tool/package_config.json
          tool/release/grind.dart okfp-deploy-pub

  homebrew:
    needs: pub-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub -C tool/release get --enforce-lockfile
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: conceptadev
          repositories: homebrew-tap
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          dart --packages=tool/release/.dart_tool/package_config.json
          tool/release/grind.dart okfp-deploy-homebrew
