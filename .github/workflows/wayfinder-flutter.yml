name: Wayfinder Flutter

on:
  push:
    branches: [main]
    paths:
      - packages/wayfinder_flutter/**
      - packages/wayfinder_reader/**
      - packages/wayfinder_reader_local/**
      - packages/wayfinder/**
      - pubspec.yaml
      - pubspec.lock
      - tool/ci/verify-reader-closure.py
      - .github/workflows/wayfinder-flutter.yml
      - tool/ci/classify_changes.py
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - packages/wayfinder_flutter/**
      - packages/wayfinder_reader/**
      - packages/wayfinder_reader_local/**
      - packages/wayfinder/**
      - pubspec.yaml
      - pubspec.lock
      - tool/ci/verify-reader-closure.py
      - .github/workflows/wayfinder-flutter.yml
      - tool/ci/classify_changes.py

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DIFF_DOTS: ${{ github.event_name == 'pull_request' && '...' || '..' }}
        run: python3 tool/ci/classify_changes.py --mode code

  test:
    needs: changes
    if: >-
      needs.changes.result == 'success' &&
      needs.changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flutter: ["3.47.5", any]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wayfinder_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 ../../tool/ci/verify-reader-closure.py
      # dart format's output depends on the version; stable defines the style.
      - if: matrix.flutter == 'any'
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
