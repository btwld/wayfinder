# The installers are the one part of Wayfinder that users run before they have
# Wayfinder, and they are not Dart, so nothing else in CI parses them. These
# checks need no release archive and no network, so they answer in a minute;
# ci.yml installs the archive it just built, and verify-public-install.yml
# installs from the published URLs.
name: Installer scripts

on:
  push:
    branches: [main]
  pull_request:
    # A draft skips every job. ready_for_review runs the suite once the
    # pull request is ready. Label and edit events are not triggers. Path
    # selection is a job below, so a ready pull request still reports this
    # check when the installer files did not change.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify installer changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DIFF_DOTS: ${{ github.event_name == 'pull_request' && '...' || '..' }}
        run: python3 tool/ci/classify_changes.py --mode installer

  posix:
    name: install.sh
    needs: changes
    if: >-
      needs.changes.result == 'success' &&
      needs.changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the POSIX scripts
        run: |
          for script in tool/install.sh tool/test_install_platform.sh; do
            sh -n "$script"
            shellcheck --shell=sh "$script"
            echo "OK: $script"
          done
      - name: Test platform detection
        run: sh tool/test_install_platform.sh

  windows:
    # Catch Windows installer regressions before merge, once per PR revision.
    # Pushes do not repeat it: main already ran the check on the pull request.
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.run == 'true' &&
      github.event.pull_request.draft == false
    # Windows PowerShell 5.1 is what a fresh Windows session runs, and it is
    # where the #98 report came from; PowerShell 7 is what a developer machine
    # usually has. The installer has to work in both.
    name: install.ps1 (${{ matrix.powershell }})
    strategy:
      fail-fast: false
      matrix:
        powershell: [pwsh, powershell]
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: ${{ matrix.powershell }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse the PowerShell scripts
        run: |
          foreach ($File in 'tool/install.ps1', 'tool/test_install_arch.ps1', 'tool/verify_installer.ps1') {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $File).Path, [ref]$Tokens, [ref]$Errors) | Out-Null
            if ($Errors.Count) { throw "$File has a parse error: $($Errors[0].Message)" }
            Write-Host "OK: $File"
          }
      - name: Test architecture detection
        run: ./tool/test_install_arch.ps1

  required-checks:
    name: Installer required checks
    needs: [changes, posix, windows]
    if: >-
      always() &&
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report the required check
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          RESULTS: posix=${{ needs.posix.result }},windows=${{ needs.windows.result }}
          # Windows is pull-request only. A main push may skip it.
          MAY_SKIP: ${{ github.event_name != 'pull_request' && 'windows' || '' }}
        run: python3 tool/ci/classify_changes.py --require
