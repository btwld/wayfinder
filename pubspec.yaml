name: okf_profile
description: The OKF profile toolchain — checks a knowledge bundle against its declared profile through the okfp command-line interface.
version: 0.1.0
repository: https://github.com/conceptadev/okf-profile
issue_tracker: https://github.com/conceptadev/okf-profile/issues
topics:
