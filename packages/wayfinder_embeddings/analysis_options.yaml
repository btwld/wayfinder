include: ../../analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "build/**"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - avoid_print
    - comment_references
    - prefer_const_constructors
    - prefer_void_to_null
    - require_trailing_commas
