name: wayfinder
description: Core Wayfinder library that validates OKF knowledge bundles and evaluates the rules of any Profile package.
# TODO: once Ack 1.7.0 is stable, depend on ack ^1.7.0 and release 0.2.0.
version: 0.2.0-beta.1
repository: https://github.com/btwld/wayfinder
issue_tracker: https://github.com/btwld/wayfinder/issues
topics:
  - okf
  - knowledge
  - markdown
  - yaml
  - metadata

environment:
  sdk: ">=3.11.0 <4.0.0"

resolution: workspace

dependencies:
  ack: ^1.7.0-beta.5
  collection: ^1.19.0
  markdown: ^7.3.0
  okf: '>=0.5.0 <0.5.1'
  path: ^1.9.1

dev_dependencies:
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.8
