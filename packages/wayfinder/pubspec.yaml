name: wayfinder
description: Core Wayfinder library that validates OKF knowledge bundles, evaluates the rules of any Profile package, and resolves a project's Profiles.
version: 0.3.0
repository: https://github.com/btwld/wayfinder
issue_tracker: https://github.com/btwld/wayfinder/issues
topics:
  - okf
  - knowledge
  - markdown
  - yaml
  - metadata

environment:
  sdk: ">=3.11.0 <4.0.0"

resolution: workspace

dependencies:
  ack: ^1.7.0
  collection: ^1.19.0
  crypto: ^3.0.3
  ffi: ^2.1.4
  markdown: ^7.3.0
  okf: '>=0.5.0 <0.5.1'
  path: ^1.9.1

dev_dependencies:
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.8
