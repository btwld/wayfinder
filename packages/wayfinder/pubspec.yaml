name: wayfinder
description: Core Wayfinder library that validates OKF knowledge bundles, evaluates the rules of any Profile package, resolves a project's Profiles, and writes bundles a Profile governs.
version: 0.5.0-beta.2
repository: https://github.com/btwld/wayfinder
issue_tracker: https://github.com/btwld/wayfinder/issues
topics:
  - okf
  - knowledge
  - markdown
  - yaml
  - metadata

environment:
  sdk: ">=3.11.0 <4.0.0"

resolution: workspace

dependencies:
  ack: ^2.0.0-beta.2
  collection: ^1.19.0
  crypto: ^3.0.3
  ffi: ^2.1.4
  markdown: ^7.3.0
  meta: ^1.16.0
  okf: ^0.7.0-beta.1
  path: ^1.9.1

dev_dependencies:
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.8
