name: okf_profile
description: The OKF profile toolchain — checks a knowledge bundle against its declared profile through the okfp command-line interface.
version: 0.2.0
repository: https://github.com/conceptadev/okf-profile
issue_tracker: https://github.com/conceptadev/okf-profile/issues
topics:
  - okf
  - knowledge
  - markdown
  - yaml
  - metadata

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

executables:
  okfp:

dependencies:
  args: ^2.7.0
  collection: ^1.19.0
  markdown: ^7.3.0
  okf: ^0.3.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.8
