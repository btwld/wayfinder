version: 0.1.0
repository: https://github.com/btwld/wayfinder/tree/main/packages/wayfinder_dart_chunker
issue_tracker: https://github.com/btwld/wayfinder/issues
topics:
  - embeddings
  - search
  - chunking
  - analyzer
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  analyzer: ">=8.4.1 <11.0.0"
  wayfinder_embeddings: ^0.3.0

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.1
  test: ^1.26.3
