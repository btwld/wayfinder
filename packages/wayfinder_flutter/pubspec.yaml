name: wayfinder_flutter
description: Flutter models and widgets for reading OKF knowledge bundles, starting with the knowledge graph.
version: 0.2.0
publish_to: none
repository: https://github.com/btwld/wayfinder/tree/main/packages/wayfinder_flutter
issue_tracker: https://github.com/btwld/wayfinder/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

dependencies:
  wayfinder: ^0.5.0-beta.2
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Core entry points are resolved from this checkout during development.
dependency_overrides:
  wayfinder:
    path: ../wayfinder
