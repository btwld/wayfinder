name: wayfinder_cli
description: Local OKF validation, knowledge indexing and semantic search.
# TODO: once Ack 1.7.0 is stable, depend on ack ^1.7.0, raise the sibling
# floors to ^0.2.0 and release 0.2.0.
version: 0.2.0-beta.1
repository: https://github.com/btwld/wayfinder/tree/main/packages/wayfinder_cli
