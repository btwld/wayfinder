  ack_mcp_dart: ^1.3.0
  args: ^2.7.0
  crypto: ^3.0.3
  okf: '>=0.5.0 <0.5.1'
  wayfinder_embeddings: ^0.2.0-beta.1
  mcp_dart: ^2.4.2
  wayfinder: ^0.2.0-beta.1
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
